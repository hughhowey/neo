# Builds the NEO Pocket Android APK (debug-signed, for sideloading).
# Runs on pocket-v* tags or by hand from the Actions tab.

name: Build NEO Pocket

on:
  push:
    tags:
      - 'pocket-v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install and assemble web assets
        run: |
          cd pocket
          npm install
          cp ../app.js www/app.js
          cp ../styles.css www/styles.css
          npx cap sync android
      - name: Build APK
        run: |
          cd pocket/android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: neo-pocket-apk
          path: pocket/android/app/build/outputs/apk/debug/app-debug.apk
